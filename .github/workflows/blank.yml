name: Android CI Build

on:
  push:
    branches: [ "main", "master", "arena/d7ba82e8-voz" ]
  workflow_dispatch:
  pull_request:
    branches: [ "main", "master" ]

permissions:
  contents: read
concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:

    runs-on: ubuntu-24.04
    timeout-minutes: 25

    steps:
    - uses: actions/checkout@v7

    - name: Set up JDK 17
      uses: actions/setup-java@v6
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Set up Gradle and validate wrapper
      uses: gradle/actions/setup-gradle@v6

    - name: Compile native Android client
      run: bash .github/scripts/android-check.sh assembleDebug

    - name: Run JVM tests
      run: bash .github/scripts/android-check.sh testDebugUnitTest

    - name: Android lint
      run: bash .github/scripts/android-check.sh lintDebug

    - name: Upload diagnostic reports
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: android-reports
        path: app/build/reports/
        if-no-files-found: ignore

    - name: Upload APK Artifact
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: debug-apk
        path: app/build/outputs/apk/debug/app-debug.apk
        if-no-files-found: ignore

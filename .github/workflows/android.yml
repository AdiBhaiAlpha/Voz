name: Android CI & APK Build

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Validate and Repair Gradle Wrapper
        run: |
          if ! jar tf gradle/wrapper/gradle-wrapper.jar > /dev/null 2>&1; then
            echo "WARNING: Gradle wrapper JAR is invalid, missing or corrupted! Downloading fresh official Gradle Wrapper..."
            mkdir -p gradle/wrapper

            GRADLE_VERSION=$(grep distributionUrl gradle/wrapper/gradle-wrapper.properties | sed 's/.*gradle-\(.*\)-bin.zip/\1/' | sed 's/-all//')

            if [ -z "$GRADLE_VERSION" ]; then
              GRADLE_VERSION="8.14.3"
            fi

            curl -L \
            "https://raw.githubusercontent.com/gradle/gradle/v${GRADLE_VERSION}/gradle/wrapper/gradle-wrapper.jar" \
            -o gradle/wrapper/gradle-wrapper.jar

            echo "Gradle Wrapper repaired successfully."
          else
            echo "SUCCESS: Gradle Wrapper JAR is valid."
          fi

      - name: Grant Execute Permission for Gradlew
        run: |
          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
          fi

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Ensure Debug Keystore Exists
        run: |
          if [ ! -f "debug.keystore" ]; then
            keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Validate Dependencies and Run Unit Tests
        run: gradle :app:testDebugUnitTest

      - name: Build Debug APK
        run: gradle :app:assembleDebug

      - name: Copy APK to Project Root
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk ./VOZ.apk
          cp app/build/outputs/apk/debug/app-debug.apk ./app-debug.apk

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: voz-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Publish Direct APK Download Release
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: "VOZ Android APK (Latest)"
          body: |
            ### Direct Download Link
            Download the raw APK directly on your phone:
            - **[Download VOZ.apk](https://github.com/${{ github.repository }}/releases/latest/download/VOZ.apk)**
            - **[Download app-debug.apk](https://github.com/${{ github.repository }}/releases/latest/download/app-debug.apk)**
          files: |
            app/build/outputs/apk/debug/app-debug.apk
            VOZ.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

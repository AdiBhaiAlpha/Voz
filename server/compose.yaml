services:
  db:
    image: postgres:18-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_DB: voz
      POSTGRES_USER: voz
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    volumes: [postgres-data:/var/lib/postgresql]
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U voz -d voz']
      interval: 5s
      timeout: 3s
      retries: 10
  api:
    build: .
    restart: unless-stopped
    init: true
    environment:
      NODE_ENV: production
      DATABASE_URL: postgres://voz:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}@db:5432/voz
      PUBLIC_ORIGIN: https://${VOZ_HOST:?Set VOZ_HOST}
      TURN_URLS: ${TURN_URLS:?Set TURN_URLS}
      STUN_URLS: ${STUN_URLS:-}
      TURN_SECRET: ${TURN_SECRET:?Set TURN_SECRET}
      TRUST_PROXY: '1'
      METRICS_TOKEN: ${METRICS_TOKEN:-}
    depends_on:
      db: {condition: service_healthy}
    read_only: true
    tmpfs: [/tmp]
    security_opt: [no-new-privileges:true]
    # No public API/DB ports. Only the trusted reverse proxy may forward client IPs.
  proxy:
    image: caddy:2
    restart: unless-stopped
    environment:
      VOZ_HOST: ${VOZ_HOST:?Set VOZ_HOST}
    ports: ['80:80', '443:443']
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on: [api]
  turn:
    image: coturn/coturn:4.6.3
    restart: unless-stopped
    network_mode: host
    entrypoint: [/bin/sh, /etc/voz/turn-entrypoint.sh]
    environment:
      TURN_SECRET: ${TURN_SECRET:?Set TURN_SECRET}
    volumes:
      - ./turn-entrypoint.sh:/etc/voz/turn-entrypoint.sh:ro
    command:
      - -n
      - --log-file=stdout
      - --fingerprint
      - --use-auth-secret
      - --realm=${TURN_HOST:?Set TURN_HOST}
      - --external-ip=${TURN_PUBLIC_IP:?Set TURN_PUBLIC_IP}
      - --listening-port=3478
      - --min-port=49160
      - --max-port=49200
      - --no-cli
      - --no-multicast-peers
      - --denied-peer-ip=0.0.0.0-0.255.255.255
      - --denied-peer-ip=10.0.0.0-10.255.255.255
      - --denied-peer-ip=127.0.0.0-127.255.255.255
      - --denied-peer-ip=169.254.0.0-169.254.255.255
      - --denied-peer-ip=172.16.0.0-172.31.255.255
      - --denied-peer-ip=192.168.0.0-192.168.255.255
      - --denied-peer-ip=::1
      - --denied-peer-ip=fc00::-fdff:ffff:ffff:ffff:ffff:ffff:ffff:ffff
      - --denied-peer-ip=fe80::-febf:ffff:ffff:ffff:ffff:ffff:ffff:ffff
      - --user-quota=4
      - --total-quota=100
      - --max-bps=64000
      - --bps-capacity=6400000
volumes:
  postgres-data:
  caddy-data:
  caddy-config:
